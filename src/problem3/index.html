<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Page - Problem 3</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="wallet-card">
      <h1 class="wallet-title">My Wallet</h1>
      <p class="wallet-subtitle">View your cryptocurrency balances sorted by priority</p>
      
      <!-- Loading State -->
      <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading wallet balances...</p>
      </div>

      <!-- Error State -->
      <div id="error-state" class="error-state">
        <p id="error-message"></p>
        <button class="retry-btn" id="retry-btn">Retry</button>
      </div>

      <!-- Wallet Balances -->
      <div id="wallet-content" class="wallet-content">
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">Total Value (USD)</span>
            <span class="stat-value" id="total-value">$0.00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active Wallets</span>
            <span class="stat-value" id="active-wallets">0</span>
          </div>
        </div>

        <div class="wallet-list" id="wallet-list">
          <!-- Wallet rows will be rendered here -->
        </div>

        <div class="empty-state" id="empty-state">
          <p>No valid balances found</p>
          <small>Only showing wallets with positive balances on supported blockchains</small>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
